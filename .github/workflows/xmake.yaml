name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ matrix.platform.toolchain }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      XMAKE_RUNTIME: ${{ matrix.platform.os == 'windows' && matrix.mode.windows_runtime || 'c++_static' }}
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: release
            windows_runtime: MD
          - name: debug
            windows_runtime: MDd
        platform:
          - runner: windows-2025
            os: windows
            arch: x64
            toolchain: msvc
          - runner: windows-2025
            os: windows
            arch: x64
            toolchain: clang-cl
            llvm_version: "23.1.0"
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            toolchain: clang-23
            llvm_version: "23"
          - runner: macos-26
            os: macos
            arch: arm64
            toolchain: mac-clang
            llvm_version: "23"
            llvm_formula: llvm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current week for cache key
        id: cache_key
        run: echo "key=$(date +'%G-W%V')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set xmake global directory
        run: echo "XMAKE_GLOBALDIR=${{ runner.temp }}/xmake-global" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Linux dependencies
        if: matrix.platform.os == 'linux'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.platform.llvm_version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.platform.llvm_version }} \
            lld-${{ matrix.platform.llvm_version }} \
            llvm-${{ matrix.platform.llvm_version }} \
            libc++-${{ matrix.platform.llvm_version }}-dev \
            libc++abi-${{ matrix.platform.llvm_version }}-dev \
            libunwind-${{ matrix.platform.llvm_version }}-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev

      - name: Verify Linux LLVM
        if: matrix.platform.os == 'linux'
        run: clang-${{ matrix.platform.llvm_version }} --version

      - name: Install LLVM for clang-cl
        if: matrix.platform.toolchain == 'clang-cl'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-${{ matrix.platform.llvm_version }}-win64.msi"
          $expectedHash = "95602d03944a7db534899adc5203988b63921ad0db71fe15748a3fe3d340416f"
          $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.platform.llvm_version }}/LLVM-${{ matrix.platform.llvm_version }}-win64.msi"
          Invoke-WebRequest -Uri $uri -OutFile $installer

          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM installer checksum mismatch: expected $expectedHash, got $actualHash"
          }

          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "LLVM installer exited with code $($process.ExitCode)"
          }

          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows LLVM
        if: matrix.platform.toolchain == 'clang-cl'
        shell: pwsh
        run: |
          $version = clang-cl --version
          $version
          if (($version -join "`n") -notmatch "version 23\.1\.0") {
            throw "Expected clang-cl 23.1.0"
          }

      - name: Set up Python
        if: matrix.platform.os == 'macos'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install macOS dependencies
        if: matrix.platform.os == 'macos'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          brew unlink simdjson || true

      - name: Install LLVM for macOS
        if: matrix.platform.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # runner images preinstall an older llvm, and install is a no-op on it
          brew update
          if brew list --versions ${{ matrix.platform.llvm_formula }} > /dev/null 2>&1; then
            brew upgrade ${{ matrix.platform.llvm_formula }}
          else
            brew install ${{ matrix.platform.llvm_formula }}
          fi
          brew unlink simdjson 2>/dev/null || true
          LLVM_PATH=$(brew --prefix ${{ matrix.platform.llvm_formula }})
          {
            echo "LLVM_PATH=$LLVM_PATH"
            echo "PATH=$LLVM_PATH/bin:$PATH"
          } >> "$GITHUB_ENV"

      - name: Verify macOS LLVM
        if: matrix.platform.os == 'macos'
        run: |
          brew list --versions ${{ matrix.platform.llvm_formula }}
          "$LLVM_PATH/bin/clang++" --version
          if ! "$LLVM_PATH/bin/clang++" --version | grep -q "clang version ${{ matrix.platform.llvm_version }}\."; then
            echo "Expected clang ${{ matrix.platform.llvm_version }} from $LLVM_PATH." >&2
            echo "If homebrew-core has moved past ${{ matrix.platform.llvm_version }}, pin llvm_formula to llvm@${{ matrix.platform.llvm_version }}." >&2
            exit 1
          fi

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo --update -vD

      - name: Retrieve dependencies hash
        id: dep_hash
        run: echo "hash=$(xmake l utils.ci.packageskey)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore cached xmake dependencies
        id: restore-depcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ env.XMAKE_RUNTIME }}-${{ matrix.platform.toolchain }}${{ matrix.platform.llvm_version }}-${{ steps.dep_hash.outputs.hash }}-${{ steps.cache_key.outputs.key }}

      - name: Configure xmake and install dependencies
        run: xmake config -v --toolchain=${{ matrix.platform.toolchain }} --arch=${{ matrix.platform.arch }} --mode=${{ matrix.mode.name }} --runtimes=${{ env.XMAKE_RUNTIME }} --yes --policies=package.precompiled:n --profile=n --lua_bindings=y --tests=false

      - name: Save cached xmake dependencies
        if: steps.restore-depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-depcache.outputs.cache-primary-key }}

      - name: Stage package shared libs (Unix)
        if: matrix.platform.os != 'windows'
        run: |
          mkdir -p dest/bin
          find "${{ env.XMAKE_GLOBALDIR }}/.xmake/packages" \( -name "*.so*" -o -name "*.dylib" \) -exec cp {} dest/bin/ \; 2>/dev/null || true
          echo "LD_LIBRARY_PATH=$PWD/dest/bin:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/dest/bin:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
        shell: bash

      - name: Stage package shared libs (Windows)
        if: matrix.platform.os == 'windows'
        run: |
          $dest = "build\windows\x64\${{ matrix.mode.name }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Path "${{ env.XMAKE_GLOBALDIR }}\.xmake\packages" -Recurse -Filter "*.dll" |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest -Force -ErrorAction SilentlyContinue }
        shell: pwsh

      - name: Build all targets
        run: xmake build -vD -a

      - name: Install project targets
        run: |
          xmake install -vo dest/
          rm -rf dest/include dest/lib
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ matrix.platform.toolchain }}-${{ env.XMAKE_RUNTIME }}
          path: dest
